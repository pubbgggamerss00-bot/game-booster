name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GameBooster-v1.0.0-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBooster-debug-apk
          path: GameBooster-v1.0.0-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Game Booster APK v1.0.${{ github.run_number }}
          body: |
            🎮 **Game Booster — debug APK (no root)**
            Built automatically by GitHub Actions from `android/`.
            Install: enable "Install unknown apps" for your browser/file manager, then open the APK.
          make_latest: true
          fail_on_unmatched_files: true
          files: GameBooster-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
